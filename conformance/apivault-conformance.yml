domain_standards:
  note: >-
    ApiVault's market is API discovery and cataloguing. The domain standard for
    that market is APIs.json (specificationVersion / apis[]) — the format this
    very repository is written in. ApiVault does not publish one, which is the
    single most consequential domain-standard gap available to it: an API
    directory that is not itself machine-discoverable.
  standards:
    - id: apis-json
      conforms: false
      evidence: >-
        Probed https://apivault.dev/apis.json (404),
        https://apivault.dev/.well-known/apis.json (404),
        https://apivault.dev/apis.yml (404) and the same three on
        api.apivault.dev (404) on 2026-09-04. Nothing carrying `apis` or
        `specificationVersion` is served.
      opportunity: >-
        The catalogue is already exposed as JSON at
        https://api.apivault.dev/api/all; rendering the same records as an
        APIs.json index at https://apivault.dev/apis.json would make 1,454
        entries discoverable to every APIs.json-aware crawler.
    - id: openapi-index
      conforms: false
      evidence: >-
        The directory records only a name, category, auth type, CORS flag,
        HTTPS flag and a URL per API. It does not record or link an OpenAPI,
        AsyncAPI or any other machine-readable contract for the APIs it lists,
        so the catalogue cannot be traversed by a machine past the landing URL.
