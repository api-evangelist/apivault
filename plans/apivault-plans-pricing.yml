note: >-
  ApiVault publishes NO plans and NO pricing, because there is nothing to buy.
  The service is free and the software is open source (CC BY-NC-ND 4.0). Every
  read operation on https://api.apivault.dev is anonymous and unmetered — all
  1,454 catalogue records are available in a single unauthenticated call to
  GET /api/all — and the authenticated half (submit an API, like an API, send
  feedback) requires only a free Google sign-in, not a paid account. There is
  no pricing page, no upgrade path, no quota, no billing surface and no
  enterprise "contact us" form. The only monetary channel the project offers is
  a voluntary Ko-fi tip link in the repository README.
  THIS REPLACES A SCAFFOLD. The previous version of this file was written by
  the 2026-05-04 bulk sweep (method: generated) and asserted an invented
  "apivault-free" tier with a 1,000-requests-per-month quota and a
  per-minute rate limit. None of that was ever published by ApiVault. It has
  been removed rather than carried forward.
